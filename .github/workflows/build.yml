name: Build Desktop Agent

# Chạy khi đẩy tag dạng v1.0.0, v1.0.1... hoặc kích hoạt thủ công từ tab Actions trên GitHub.
# Đẩy tag = phát hành thật: publish lên GitHub Releases kèm latest.yml/latest-mac.yml để
# electron-updater (auto-update trong app) tìm thấy bản mới. Kích hoạt thủ công = chỉ build
# thử, không publish, dùng để kiểm tra build có chạy được không.
#
# package.json's build:mac/build:win mặc định --publish never (an toàn khi build ở máy
# local) - job này override lại bằng --publish always CHỈ khi trigger là tag push.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  # Tạo sẵn 1 GitHub Release TRƯỚC khi build, chỉ khi trigger là tag push. Lý do: nếu để
  # electron-builder tự "tạo release nếu chưa có" thì mỗi publish target (mac có 2 target
  # dmg+zip, cộng thêm job win riêng) đều tự kiểm tra "release đã tồn tại chưa" gần như
  # đồng thời - dẫn đến race condition, mỗi target tưởng release chưa tồn tại nên tự tạo
  # 1 cái riêng => nhiều release trùng tag, mỗi cái chỉ có 1 phần file (đã gặp thực tế).
  # Tạo sẵn ở đây thì mọi target sau đó chỉ cần tìm-và-upload vào release có sẵn, không
  # còn ai phải "tạo mới" nữa nên hết race.
  create-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes

  build-mac:
    needs: [create-release]
    if: always() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Build and publish macOS dmg (tag push)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --mac --universal --publish always

      - name: Build macOS dmg only (manual test build)
        if: github.event_name != 'push'
        run: npm run build:mac

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/*.dmg

  build-win:
    needs: [create-release]
    if: always() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Build and publish Windows exe (tag push)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always

      - name: Build Windows exe only (manual test build)
        if: github.event_name != 'push'
        run: npm run build:win

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/*.exe
