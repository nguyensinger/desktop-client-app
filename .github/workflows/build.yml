name: Build Desktop Agent

# Chạy khi đẩy tag dạng v1.0.0, v1.0.1... hoặc kích hoạt thủ công từ tab Actions trên GitHub.
# Đẩy tag = phát hành thật: publish lên GitHub Releases kèm latest.yml/latest-mac.yml để
# electron-updater (auto-update trong app) tìm thấy bản mới. Kích hoạt thủ công = chỉ build
# thử, không publish, dùng để kiểm tra build có chạy được không.
#
# package.json's build:mac/build:win mặc định --publish never (an toàn khi build ở máy
# local) - job này override lại bằng --publish always CHỈ khi trigger là tag push.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Build and publish macOS dmg (tag push)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --mac --universal --publish always

      - name: Build macOS dmg only (manual test build)
        if: github.event_name != 'push'
        run: npm run build:mac

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/*.dmg

  build-win:
    needs: build-mac
    # Chạy TUẦN TỰ sau build-mac, không song song - nếu cả 2 job cùng publish cùng
    # lúc cho cùng 1 tag, electron-builder không kịp thấy release mà job kia vừa tạo,
    # dẫn đến mỗi job tự tạo 1 release riêng (rời rạc, mỗi cái chỉ có 1 nửa file).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Build and publish Windows exe (tag push)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always

      - name: Build Windows exe only (manual test build)
        if: github.event_name != 'push'
        run: npm run build:win

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/*.exe
